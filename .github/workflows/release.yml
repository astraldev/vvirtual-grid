name: Release

on:
  release:
    types: [created]

jobs:
  release:
    name: Test, Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Lint
        run: pnpm --filter=vvirtual-grid run lint

      - name: Unit Test
        run: pnpm run test

      - name: Build
        run: pnpm --filter=vvirtual-grid run build

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter=vvirtual-grid publish --no-git-checks
